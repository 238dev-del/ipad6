name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show project files (debug)
        run: ls -la

      - name: Build unsigned .app
        run: |
          xcodebuild -project PenNote.xcodeproj \
            -scheme PenNote \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            clean build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r PenNote.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenNote-ipa
          path: PenNote.ipa
